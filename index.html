<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMED Lab | UCI Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 antialiased">

    <nav class="bg-white shadow-sm py-4">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#0064a4] rounded flex items-center justify-center text-white font-bold text-xl">B</div>
                <div class="flex flex-col">
                    <span class="text-[#0064a4] font-bold tracking-tight text-lg leading-none uppercase" style="font-family: 'Montserrat', sans-serif;">Behavioral Medicine</span>
                    <span class="text-xs font-medium tracking-widest text-gray-500 uppercase">Research Lab | UC Irvine</span>
                </div>
            </div>
        </div>
    </nav>

    <section class="relative">
        <div class="h-[60vh] w-full bg-gray-200 overflow-hidden">
            <img src="hero.jpg" alt="Lab Research" class="w-full h-full object-cover">
        </div>

        <div class="max-w-4xl mx-auto -mt-32 relative z-10 bg-white p-10 md:p-16 shadow-2xl border-l-[12px] border-[#ffd200]">
            <h1 class="text-4xl md:text-5xl font-extrabold text-[#0064a4] mb-6 leading-tight" style="font-family: 'Montserrat', sans-serif;">
                Innovating <br>Biobehavioral Health
            </h1>
            <p class="text-xl text-gray-700 mb-8 leading-relaxed font-light">
                Conducting cutting-edge research to shape psychological adjustment and coping in the face of chronic disease and health-related adversity.
            </p>
            <a href="#" class="inline-block bg-[#0064a4] text-white px-8 py-4 rounded-full font-bold uppercase tracking-widest text-sm hover:bg-[#004d7c] transition-all shadow-lg">
                Explore Our Mission
            </a>
        </div>
    </section>

    <footer class="py-20 text-center">
        <div class="w-12 h-1 bg-[#ffd200] mx-auto mb-6"></div>
        <p class="text-sm text-gray-400 uppercase tracking-widest">© 2026 Behavioral Medicine Research Lab • UC Irvine</p>
    </footer>

</body>
</html>
