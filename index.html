<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>BMED Lab Test</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            return (
                <div className="min-h-screen">
                    <nav className="bg-[#0064a4] p-4 text-white shadow-lg">
                        <h1 className="text-xl font-bold uppercase tracking-tight">Behavioral Medicine Lab | UCI</h1>
                    </nav>
                    
                    <main className="max-w-4xl mx-auto mt-10 p-6 bg-white shadow-xl rounded-lg">
                        <div className="h-64 bg-gray-300 mb-6 overflow-hidden rounded">
                            <img 
                                src="hero.jpg" 
                                alt="Check if hero.jpg is in the same folder" 
                                className="w-full h-full object-cover"
                                onError={(e) => { e.target.style.display = 'none'; }}
                            />
                            <div className="p-10 text-center text-gray-500">
                                If you see this text, upload <b>hero.jpg</b> to your GitHub folder!
                            </div>
                        </div>
                        <h2 className="text-3xl font-extrabold text-[#0064a4] mb-4">Innovating Biobehavioral Health</h2>
                        <p className="text-gray-700 leading-relaxed">
                            If you can see this box, your React code is working perfectly!
                        </p>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
